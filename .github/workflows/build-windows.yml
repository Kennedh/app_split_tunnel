name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build single-file executable
        shell: powershell
        run: .\tools\build_exe.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ApplicationSplitRouting-windows-x64
          path: dist/ApplicationSplitRouting.exe
